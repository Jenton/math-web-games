<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kenney bundle browser</title>
<style>
  body{font:14px system-ui,sans-serif;margin:0;background:#1d2330;color:#e8ecf4}
  header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#141923;border-bottom:1px solid #2c3446}
  input,select,button{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #3a4560;background:#222a3b;color:inherit}
  #q{flex:1;min-width:160px} button{cursor:pointer} button:hover{background:#2e3850}
  #info{opacity:.7;margin-left:auto}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:12px}
  .card{position:relative;background:#262e41;border-radius:8px;padding:6px;font-size:11px;overflow:hidden}
  .card .img{height:96px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#2d3548 0 25%,#232a3b 0 50%) 0 0/16px 16px;border-radius:4px}
  .card img{max-width:100%;max-height:96px;image-rendering:auto}
  .nm{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .meta{opacity:.6}
  .star{position:absolute;top:2px;right:2px;font-size:20px;line-height:1;background:#0008;border:0;padding:2px 6px;color:#ccd}
  .star.on{color:#ffd23f} .card.on{outline:2px solid #ffd23f}
  #more{margin:0 12px 24px}
  #err{padding:20px;color:#ff9b9b}
</style></head><body>
<header>
  <input id="q" type="search" placeholder="Search names and packs: arrow, target, flag, tower..." autofocus>
  <select id="cat"><option value="">All categories</option></select>
  <select id="pack"><option value="">All packs</option></select>
  <label><input id="only" type="checkbox"> Starred only</label>
  <button id="export">Export shortlist.json (<span id="n">0</span>)</button>
  <button id="clear" title="Remove every star">Clear stars</button>
  <span id="info"></span>
</header>
<div id="err" hidden></div>
<div id="grid"></div>
<button id="more" hidden>Show more</button>
<script>
'use strict';
const PAGE = 300; let M = [], shown = 0, list = [];
let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem('kenneyStars') || '[]')); } catch (e) {}
const $ = (id) => document.getElementById(id);
const save = () => { try { localStorage.setItem('kenneyStars', JSON.stringify([...stars])); } catch (e) {} $('n').textContent = stars.size; };
const kb = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

function filter() {
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(Boolean), cat = $('cat').value, pack = $('pack').value, only = $('only').checked;
  list = M.items.filter((i) => (!cat || i.category === cat) && (!pack || i.pack === pack) && (!only || stars.has(i.path)) &&
    terms.every((t) => (i.path + ' ' + i.pack).toLowerCase().includes(t)));
  $('grid').textContent = ''; shown = 0; more(); $('info').textContent = list.length + ' of ' + M.count;
}
function more() {
  const frag = document.createDocumentFragment();
  for (const i of list.slice(shown, shown + PAGE)) {
    const c = document.createElement('div'); c.className = 'card' + (stars.has(i.path) ? ' on' : ''); c.title = i.path;
    const im = document.createElement('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = i.name;
    im.src = '/thumbs/' + i.id + '.png'; im.onerror = () => { im.onerror = null; im.src = '/file/' + enc(i.path); };   // no thumbnail: show the original
    const box = document.createElement('div'); box.className = 'img'; box.appendChild(im);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = i.name;
    const meta = document.createElement('div'); meta.className = 'meta nm'; meta.textContent = i.pack + ' · ' + (i.width ? i.width + '×' + i.height + ' · ' : '') + kb(i.bytes);
    const s = document.createElement('button'); s.className = 'star' + (stars.has(i.path) ? ' on' : ''); s.textContent = stars.has(i.path) ? '★' : '☆'; s.setAttribute('aria-label', 'Star ' + i.name);
    s.onclick = () => { stars.has(i.path) ? stars.delete(i.path) : stars.add(i.path); const on = stars.has(i.path); s.textContent = on ? '★' : '☆'; s.classList.toggle('on', on); c.classList.toggle('on', on); save(); };
    c.append(box, nm, meta, s); frag.appendChild(c);
  }
  shown = Math.min(list.length, shown + PAGE); $('grid').appendChild(frag); $('more').hidden = shown >= list.length;
}
function fillPacks() {
  const cat = $('cat').value, packs = [...new Set(M.items.filter((i) => !cat || i.category === cat).map((i) => i.pack))].sort();
  $('pack').innerHTML = '<option value="">All packs (' + packs.length + ')</option>' + packs.map((p) => '<option>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</option>').join('');
}
$('export').onclick = () => {
  const byPath = new Map(M.items.map((i) => [i.path, i]));
  const out = { bundle: M.bundle, made: new Date().toISOString(), items: [...stars].map((p) => byPath.get(p)).filter(Boolean).map(({ category, pack, path, name, bytes, width, height }) => ({ category, pack, path, name, bytes, width, height })) };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })); a.download = 'shortlist.json'; a.click();
};
$('clear').onclick = () => { if (stars.size && confirm('Remove all ' + stars.size + ' stars?')) { stars.clear(); save(); filter(); } };
$('more').onclick = more;
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(filter, 150); };
$('cat').onchange = () => { fillPacks(); filter(); }; $('pack').onchange = filter; $('only').onchange = filter;
fetch('/manifest.json').then((r) => { if (!r.ok) throw new Error('no manifest'); return r.json(); }).then((m) => {
  M = m; for (const c of [...new Set(m.items.map((i) => i.category))]) $('cat').insertAdjacentHTML('beforeend', '<option>' + c + '</option>');
  fillPacks(); save(); filter();
}).catch(() => { $('err').hidden = false; $('err').textContent = 'No manifest yet. Run: node tools/kenney-browser/build-manifest.js --thumbs'; });
</script></body></html>
