# Usage (from this folder): see README.md "Hosting it on the Mac mini".
# BUNDLE_DIR is the Kenney folder on the Mac (mounted read-only). The port is published on localhost only: put `tailscale serve` in front of it.
services:
  kenney-browser:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      KENNEY_BUNDLE: /bundle
    volumes:
      - "${BUNDLE_DIR:-/Volumes/JentMini Drive/AI Projects/Kenney Game Assets All-in-1 3.8.0}:/bundle:ro"
      - ./out:/app/out
